name: Python CI + Docker

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/factorial-app:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/factorial-app:latest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker image
        run: docker pull ghcr.io/${{ github.repository_owner }}/factorial-app:latest

      - name: Remove old container
        shell: powershell
        run: |
          docker rm -f factorial-container
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No old container found"
          }

      - name: Run new container
        run: docker run -d -p 5000:5000 --name factorial-container ghcr.io/${{ github.repository_owner }}/factorial-app:latest